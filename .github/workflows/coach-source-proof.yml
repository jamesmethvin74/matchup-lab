name: Current NCAA coach source proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coach-source-proof.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current-season published head-coach table
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {parsePublishedCoaches} from './src/coach-ingest.js';
          const url="https://en.wikipedia.org/wiki/List_of_current_NCAA_Division_I_men%27s_basketball_coaches";
          const response=await fetch(url,{headers:{"user-agent":"MatchupLabSourceAudit/0.1 (public statistics, no personal data)",accept:"text/html"},signal:AbortSignal.timeout(20000)});
          console.log("COACH_SOURCE_HTTP",response.status);
          if(!response.ok)throw new Error("Source HTTP "+response.status);
          const html=await response.text();
          console.log("COACH_SOURCE_BYTES",html.length);
          const records=parsePublishedCoaches(html);
          console.log("COACH_PARSED_COUNT",records.length);
          console.log("COACH_ARKANSAS",JSON.stringify(records.find(r=>r.team==='Arkansas Razorbacks')));
          console.log("COACH_DUKE",JSON.stringify(records.find(r=>r.team==='Duke Blue Devils')));
          const teamsResponse=await fetch('https://matchup-lab-api.james-methvin74.workers.dev/api/teams?season=2027', {signal:AbortSignal.timeout(15000)});
          if(!teamsResponse.ok)throw new Error('Production team directory HTTP '+teamsResponse.status);
          const listing=await teamsResponse.json();
          const teams=listing.teams||[];
          const normalize=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const names=new Set(teams.flatMap(t=>[normalize(t.name),normalize((t.school||'')+' '+(t.mascot||''))]));
          console.log('COACH_TEAM_MATCHES',JSON.stringify({availableTeams:teams.length, exact:records.filter(r=>names.has(normalize(r.team))).length,
            arkansas:teams.filter(t=>/arkansas razorbacks/i.test(t.name)),duke:teams.filter(t=>/duke blue devils/i.test(t.name))}));
          if(!records.some(r=>r.team==='Arkansas Razorbacks'&&r.coach==='John Calipari'))throw new Error('Arkansas coach source mismatch');
          const tables=[...html.matchAll(/<table\b[^>]*class="[^"]*wikitable[^"]*"[^>]*>/gi)];
          console.log("COACH_SOURCE_TABLES",tables.length);
          const start=html.indexOf("<table",html.indexOf("List of current NCAA"));
          const anchor=html.indexOf("Arkansas Razorbacks",start>=0?start:0);
          console.log("COACH_SOURCE_ARKANSAS_ROW",html.slice(Math.max(0,anchor-500),anchor+1200).replace(/\s+/g," ").slice(0,1700));
          if(!html.includes("John Calipari")||!html.includes("Arkansas Razorbacks"))throw new Error("Expected current Arkansas coach listing missing");
          JS
